[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-gesture-assistant"
version = "0.1.0"
description = "Local Windows desktop agent for voice and gesture control"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
windows = [
    "pyautogui>=0.9",
    "pywinauto>=0.6",
    "pycaw>=20181228",
    "pyperclip>=1.8",
]
audio = [
    "sounddevice>=0.4",
    "faster-whisper>=0.10",
    "sherpa-onnx>=1.9",
]
vision = [
    "mediapipe>=0.10",
    "opencv-python>=4.8",
]
ui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8",
    "pytest-mock>=3.12",
    "mypy>=1.8",
    "ruff>=0.3",
]
all = [
    "voice-gesture-assistant[windows,audio,vision,ui]",
]

[project.scripts]
vga = "app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
