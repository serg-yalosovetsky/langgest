shell_policy:
  auto_execute_allowed:
    - "cls"
    - "clear"
    - "pwd"
    - "dir"
    - "dir *"
    - "ls"
    - "ls *"
    - "git status"
    - "git log"
    - "git diff"
    - "git branch"
    - "echo *"
    - "type *"
    - "cat *"
    - "python --version"
    - "pip list"

  require_confirmation_patterns:
    - "git push"
    - "git reset"
    - "git clean"
    - "docker compose down"
    - "docker rm"
    - "kubectl delete"
    - "kubectl apply"
    - "rm "
    - "del "
    - "rmdir"
    - "format"
    - "shutdown"
    - "restart"
    - "drop database"
    - "drop table"
    - "truncate"
    - "mkfs"

  forbidden_patterns:
    - "rm -rf /"
    - "del /f /q C:\\"
    - "format c:"
    - ":(){:|:&};:"
